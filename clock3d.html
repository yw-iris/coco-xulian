<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coco · ΧΡΟΝΟΣ — 时钟 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+SC:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--ink:#e9e6dc;--muted:#8a857a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Serif SC',serif;overflow:hidden}
#stage{position:fixed;inset:0}
.frame{position:fixed;inset:14px;border:1px solid var(--ink);pointer-events:none;z-index:5;opacity:.8}
.frame::after{content:'';position:absolute;inset:4px;border:1px solid rgba(233,230,220,.28)}
.hud{position:fixed;z-index:6;pointer-events:none}
.hud.tl{top:34px;left:38px}
.hud.tr{top:34px;right:38px;text-align:right}
.hud.bl{bottom:34px;left:38px}
.hud.br{bottom:34px;right:38px;text-align:right}
.hud .t1{font-family:'Cinzel',serif;font-size:15px;letter-spacing:.5em}
.hud .t2{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.34em;color:var(--muted);margin-top:6px}
.hud a{pointer-events:auto;color:var(--ink);text-decoration:none;font-family:'Cinzel',serif;
  font-size:11px;letter-spacing:.28em;border:1px solid var(--ink);padding:8px 16px;transition:.3s}
.hud a:hover{background:var(--ink);color:var(--bg)}
.hint{font-size:12px;font-weight:300;letter-spacing:.22em;color:var(--muted)}
#clock-txt{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.4em;color:var(--ink)}
#load{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;transition:opacity .8s}
#load.off{opacity:0;pointer-events:none}
#load .g{font-family:'Cinzel',serif;font-size:16px;letter-spacing:.5em;padding-left:.5em}
#load .bar{width:180px;height:1px;background:rgba(233,230,220,.18);overflow:hidden}
#load .bar i{display:block;height:100%;width:40%;background:var(--ink);animation:ld 1.1s infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(280%)}}
@media(max-width:640px){.hud.tl{top:24px;left:22px}.hud.tr{top:24px;right:22px}
  .hud.bl{bottom:24px;left:22px}.hud.br{bottom:24px;right:22px}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="frame"></div>

<div class="hud tl"><div class="t1">ΧΡΟΝΟΣ</div><div class="t2">COCO · 时钟 3D 建模</div></div>
<div class="hud tr"><a href="index.html">← ΕΛΛΑΣ 返回神庙</a></div>
<div class="hud bl"><div class="hint">拖动旋转 · 滚轮缩放 · 静置自转</div></div>
<div class="hud br"><div id="clock-txt">--:--:--</div></div>

<div id="load"><div class="g">ΧΡΟΝΟΣ</div><div class="bar"><i></i></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ================= 基础场景 ================= */
const stage=document.getElementById('stage');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0c0c0c);
scene.fog=new THREE.Fog(0x0c0c0c,9,22);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
camera.position.set(0,0.6,7.2);
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true});
}catch(e){
  document.getElementById('load').innerHTML='<div class="g" style="text-align:center;line-height:2">ΧΡΟΝΟΣ<br><span style="font-size:12px;letter-spacing:.3em;color:var(--muted);font-family:Noto Serif SC,serif">当前环境不支持 WebGL，请在支持 3D 的浏览器中打开</span></div>';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
stage.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,.85));
const dl=new THREE.DirectionalLight(0xfff8ec,.9); dl.position.set(4,6,8); scene.add(dl);
const dl2=new THREE.DirectionalLight(0xcfd6ff,.35); dl2.position.set(-6,-3,-4); scene.add(dl2);

/* ================= 素材加载 ================= */
const loader=new THREE.TextureLoader();
const T=d=>loader.load(d);
const texDial=T('assets/clk_dial.jpg'), texFull=T('assets/clk_full.jpg');
const texInkA=T('assets/ink_a.jpg'),  texInkB=T('assets/ink_b.jpg');

/* ---- 背景原画（世界深处的那幅画） ---- */
const bg=new THREE.Mesh(new THREE.PlaneGeometry(9.4,12.5),
  new THREE.MeshBasicMaterial({map:texFull,color:0x9a9a9a}));
bg.position.set(0.4,.4,-5.4); scene.add(bg);

/* ---- 表盘墨面 ---- */
const clock3d=new THREE.Group(); scene.add(clock3d);
const dial=new THREE.Mesh(new THREE.CircleGeometry(1.42,96),
  new THREE.MeshStandardMaterial({map:texDial,roughness:.92,metalness:.05}));
clock3d.add(dial);

/* ---- 白色厚表圈（对应画中的白环） ---- */
const bezel=new THREE.Mesh(new THREE.TorusGeometry(1.52,.155,26,120),
  new THREE.MeshStandardMaterial({color:0xe9e6dc,roughness:.5,metalness:.12}));
bezel.position.z=.1; clock3d.add(bezel);

/* ---- 罗马数字环（Cinzel，canvas 绘制） ---- */
function ringTex(draw){
  const c=document.createElement('canvas');c.width=c.height=1024;
  const g=c.getContext('2d');draw(g,512);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;
}
const texNum=ringTex((g,C)=>{
  g.fillStyle='#e9e6dc';g.textAlign='center';g.textBaseline='middle';
  const nums=['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
  g.font='600 92px Cinzel, Georgia, serif';
  nums.forEach((n,i)=>{const a=i/12*Math.PI*2-Math.PI/2,r=442;
    g.save();g.translate(C+r*Math.cos(a),C+r*Math.sin(a));
    g.rotate(a+Math.PI/2);g.fillText(n,0,0);g.restore();});
});
const numerals=new THREE.Mesh(new THREE.RingGeometry(1.62,2.16,96),
  new THREE.MeshBasicMaterial({map:texNum,transparent:true,side:THREE.DoubleSide,depthWrite:false}));
numerals.position.z=.02; clock3d.add(numerals);

/* ---- 内圈墨色刻度 ---- */
const texTick=ringTex((g,C)=>{
  g.strokeStyle='#0d0d0d';
  for(let i=0;i<60;i++){const a=i/60*Math.PI*2,maj=i%5===0;
    g.lineWidth=maj?10:3.5;g.globalAlpha=maj?.95:.6;
    const r1=maj?452:462,r2=496;
    g.beginPath();
    g.moveTo(C+r1*Math.cos(a),C+r1*Math.sin(a));
    g.lineTo(C+r2*Math.cos(a),C+r2*Math.sin(a));
    g.stroke();}
});
const ticks=new THREE.Mesh(new THREE.RingGeometry(1.2,1.42,96),
  new THREE.MeshBasicMaterial({map:texTick,transparent:true,side:THREE.DoubleSide,depthWrite:false}));
ticks.position.z=.05; clock3d.add(ticks);

/* ---- 指针（真实走时） ---- */
const handMat=new THREE.MeshStandardMaterial({color:0xf2efe6,roughness:.35,metalness:.2});
function hand(w,len,z){
  const geo=new THREE.BoxGeometry(w,len,w*.55);
  geo.translate(0,len/2-.12,0);
  const m=new THREE.Mesh(geo,handMat);m.position.z=z;return m;
}
const hH=hand(.09,.86,.14), hM=hand(.06,1.28,.18), hS=hand(.022,1.42,.22);
clock3d.add(hH,hM,hS);
const hub=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.1,24),handMat);
hub.rotation.x=Math.PI/2;hub.position.z=.24;clock3d.add(hub);
function setTime(){
  const d=new Date(),
    s=d.getSeconds()+d.getMilliseconds()/1000,
    m=d.getMinutes()+s/60, h=(d.getHours()%12)+m/60;
  hS.rotation.z=-s/60*Math.PI*2;
  hM.rotation.z=-m/60*Math.PI*2;
  hH.rotation.z=-h/12*Math.PI*2;
  const p=n=>String(n).padStart(2,'0');
  document.getElementById('clock-txt').textContent=
    p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}

/* ---- 墨迹飘浮粒子 ---- */
const inkMatA=new THREE.SpriteMaterial({map:texInkA,blending:THREE.AdditiveBlending,opacity:.55,depthWrite:false});
const inkMatB=new THREE.SpriteMaterial({map:texInkB,blending:THREE.AdditiveBlending,opacity:.5,depthWrite:false});
const drops=[];
for(let i=0;i<10;i++){
  const sp=new THREE.Sprite(i%2?inkMatA.clone():inkMatB.clone());
  const r=3+Math.random()*3.4, th=Math.random()*Math.PI*2;
  sp.position.set(r*Math.cos(th),(Math.random()-.5)*5,r*Math.sin(th)*.6-1);
  const s=1.4+Math.random()*2.4; sp.scale.set(s,s*(.7+Math.random()*.9),1);
  sp.material.rotation=Math.random()*Math.PI*2;
  sp.userData={w:(Math.random()-.5)*.0016,b:Math.random()*Math.PI*2,bs:.2+Math.random()*.4};
  scene.add(sp);drops.push(sp);
}

/* ================= 交互 ================= */
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;
controls.minDistance=3.4;controls.maxDistance=13;
controls.autoRotate=false;controls.autoRotateSpeed=.9;
let lastAct=performance.now();
['pointerdown','wheel','pointermove'].forEach(ev=>
  addEventListener(ev,()=>{lastAct=performance.now();controls.autoRotate=false;},{passive:true}));

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ================= 主循环 ================= */
let ready=0;const need=4;
[texDial,texFull,texInkA,texInkB].forEach(t=>{t.onload=()=>{if(++ready===need)
  document.getElementById('load').classList.add('off');};});
const t0=performance.now();
(function anim(){
  requestAnimationFrame(anim);
  setTime();
  if(performance.now()-lastAct>3200)controls.autoRotate=true;
  clock3d.rotation.y=Math.sin((performance.now()-t0)/4200)*.06;
  clock3d.rotation.x=Math.cos((performance.now()-t0)/5300)*.04;
  drops.forEach(d=>{d.material.rotation+=d.userData.w;
    d.position.y+=Math.sin((performance.now()/1000+d.userData.b)*d.userData.bs)*.0012;});
  controls.update();
  renderer.render(scene,camera);
})();
</script>
</body>
</html>
